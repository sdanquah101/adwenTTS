[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "adwentts-worker"
version = "0.1.0"
description = "AdwenTTS inference worker: voice-cloning text-to-speech with swappable engines"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "numpy>=1.24",
  "soundfile>=0.12",
]

[project.optional-dependencies]
chatterbox = ["chatterbox-tts>=0.1.7"]
ui = ["gradio>=4.0"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
adwentts = "adwentts_worker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["adwentts_worker"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
